name: Build RAFEL Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK & install platforms
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR/cmdline-tools/latest/bin" ]; then
            echo "Installing Android cmdline-tools into $SDK_DIR..."
            mkdir -p "$SDK_DIR/cmdline-tools"
            curl -sSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q -o /tmp/cmdline-tools.zip -d /tmp/cmdline-unpack
            rm -rf "$SDK_DIR/cmdline-tools/latest"
            mv /tmp/cmdline-unpack/cmdline-tools "$SDK_DIR/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-unpack
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_DIR" --licenses > /dev/null 2>&1 || true
          "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_DIR" --install "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          SECRET_B64="$(printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]')"
          FILE_B64=""
          if [ -f debug.keystore.base64 ]; then
            FILE_B64="$(tr -d '[:space:]' < debug.keystore.base64)"
          fi

          if [ -n "$SECRET_B64" ]; then
            echo "Using fixed debug keystore from GitHub Secret DEBUG_KEYSTORE_BASE64..."
            printf '%s' "$SECRET_B64" | base64 -d > debug.keystore
          elif [ -n "$FILE_B64" ]; then
            echo "Using fixed debug keystore from repository root debug.keystore.base64..."
            printf '%s' "$FILE_B64" | base64 -d > debug.keystore
          else
            echo "Using embedded fixed debug keystore from workflow..."
            tr -d '[:space:]' <<'EOF' | base64 -d > debug.keystore
          
          EOF
          fi

          if [ ! -s debug.keystore ]; then
            echo "::error::Decoded debug.keystore is empty."
            exit 1
          fi

          KEYTOOL_OUT="$(keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey)"
          echo "$KEYTOOL_OUT"
          SHA256_FP="$(printf '%s\n' "$KEYTOOL_OUT" | grep -i 'SHA-256' || true)"
          echo "Verified debug signing key (alias: androiddebugkey) — $SHA256_FP"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK output
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/RAFEL-debug.apk
          ls -lh app/build/outputs/apk/debug/RAFEL-debug.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/RAFEL-debug.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" dump badging app/build/outputs/apk/debug/RAFEL-debug.apk | head -n 20
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -v 4 app/build/outputs/apk/debug/RAFEL-debug.apk | tail -n 5

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAFEL-debug-apk
          path: app/build/outputs/apk/debug/RAFEL-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish direct APK to GitHub Release
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-debug >/dev/null 2>&1; then
            gh release upload latest-debug app/build/outputs/apk/debug/RAFEL-debug.apk --clobber
          else
            gh release create latest-debug app/build/outputs/apk/debug/RAFEL-debug.apk \
              --title "RAFEL Latest Debug APK" \
              --notes "Latest automated debug APK build from GitHub Actions."
          fi
